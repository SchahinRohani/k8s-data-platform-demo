apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  timeout: 10m
  releaseName: external-secrets

  chartRef:
    kind: OCIRepository
    name: external-secrets
    namespace: flux-system

  install:
    crds: Create
    strategy:
      name: RetryOnFailure
      retryInterval: 1m

  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 1m

  driftDetection:
    mode: enabled