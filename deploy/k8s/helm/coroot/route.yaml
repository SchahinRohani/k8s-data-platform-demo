apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coroot
  namespace: observability
spec:
  parentRefs:
    - name: aws-internet-facing
      namespace: gateway
      sectionName: https

  hostnames:
    - coroot.aws.scaliir.digital

  rules:
    - backendRefs:
        - name: coroot-coroot
          port: 8080