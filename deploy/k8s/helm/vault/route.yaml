apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: vault
spec:
  parentRefs:
    - name: aws-internet-facing
      namespace: gateway
      sectionName: https
  hostnames:
    - vault.aws.scaliir.digital
  rules:
    - backendRefs:
        - name: vault-ui
          port: 8200