apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml

configMapGenerator:
  - name: airflow-values
    namespace: airflow
    files:
      - values.yaml=values.yaml
    options:
      labels:
        reconcile.fluxcd.io/watch: Enabled

  - name: airflow-dags
    namespace: airflow
    files:
      - orders_pipeline.py=dags/orders_pipeline.py
    options:
      labels:
        reconcile.fluxcd.io/watch: Enabled

generatorOptions:
  disableNameSuffixHash: true