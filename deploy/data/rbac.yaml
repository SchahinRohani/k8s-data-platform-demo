apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: data
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-pod-operator
  namespace: data
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, patch, watch]
  - apiGroups: [""]
    resources: [pods/log, pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-pod-operator
  namespace: data
subjects:
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: airflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-pod-operator
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pipeline-s3
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: pipeline-s3
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_key }}"
        AWS_DEFAULT_REGION: us-east-1
        AWS_EC2_METADATA_DISABLED: "true"
        S3_ENDPOINT: http://rustfs.storage.svc.cluster.local:9000
  dataFrom:
    - extract:
        key: rustfs