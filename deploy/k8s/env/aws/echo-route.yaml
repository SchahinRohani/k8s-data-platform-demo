apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args:
            - "-listen=:5678"
            - "-text=AWS gateway works"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: gateway
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: gateway
spec:
  parentRefs:
    - name: aws-internet-facing
  hostnames:
    - echo.aws.scaliir.digital
  rules:
    - backendRefs:
        - name: echo
          port: 80