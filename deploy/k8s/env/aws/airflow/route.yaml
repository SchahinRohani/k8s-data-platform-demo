apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: airflow
  namespace: airflow
spec:
  hostnames:
    - airflow.aws.scaliir.digital

  parentRefs:
    - name: aws-internet-facing
      namespace: gateway
      sectionName: https

  rules:
    - backendRefs:
        - name: airflow-api-server
          port: 8080