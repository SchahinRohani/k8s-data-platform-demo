apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-local
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-helm-local

  interval: 5m
  retryInterval: 1m
  timeout: 15m
  path: ./deploy/k8s/env/local
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: platform