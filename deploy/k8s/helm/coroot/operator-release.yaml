apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coroot-operator
  namespace: observability
spec:
  interval: 30m
  timeout: 10m
  releaseName: coroot-operator

  chart:
    spec:
      chart: coroot-operator
      version: "0.9.10"
      sourceRef:
        kind: HelmRepository
        name: coroot
        namespace: flux-system

  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m

  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m