apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-aws
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 15m
  path: ./deploy/k8s/env/aws
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: platform
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-aws-certificates
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-aws

  interval: 5m
  retryInterval: 1m
  timeout: 10m

  path: ./deploy/k8s/env/aws/certificates
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: platform