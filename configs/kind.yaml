apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: local

networking:
  disableDefaultCNI: true
  kubeProxyMode: none

nodes:
  - role: control-plane
    labels:
      component: gateway
    extraPortMappings:
      - containerPort: 8081
        hostPort: 8081
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker

containerdConfigPatches:
  - |-
    [plugins."io.containerd.cri.v1.images".registry]
      config_path = "/etc/containerd/certs.d"