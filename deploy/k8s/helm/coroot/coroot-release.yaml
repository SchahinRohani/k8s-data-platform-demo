apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coroot
  namespace: observability
spec:
  interval: 30m
  timeout: 20m
  releaseName: coroot

  dependsOn:
    - name: coroot-operator
      namespace: observability

  chart:
    spec:
      chart: coroot-ce
      version: "0.3.3"
      sourceRef:
        kind: HelmRepository
        name: coroot
        namespace: flux-system

  valuesFrom:
    - kind: Secret
      name: coroot-helm-values
      valuesKey: values.yaml

  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m

  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m

  values:
    metricsRefreshInterval: 15s
    metricsTTL: 3d
    logsTTL: 3d
    tracesTTL: 3d
    storeMetricsInClickhouse: true