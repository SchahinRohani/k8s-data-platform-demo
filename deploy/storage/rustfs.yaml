apiVersion: v1
kind: Namespace
metadata:
  name: storage
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-credentials
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: rustfs-credentials
    creationPolicy: Owner
    template:
      data:
        RUSTFS_ACCESS_KEY: "{{ .access_key }}"
        RUSTFS_SECRET_KEY: "{{ .secret_key }}"
        AWS_ACCESS_KEY_ID: "{{ .access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_key }}"
  dataFrom:
    - extract:
        key: rustfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          args:
            - /data
          env:
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS
              value: "*"
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: info
          envFrom:
            - secretRef:
                name: rustfs-credentials
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: storage
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs
  namespace: storage
spec:
  hostnames:
    - rustfs.localhost
  parentRefs:
    - name: local
      namespace: gateway
      sectionName: http
  rules:
    - backendRefs:
        - name: rustfs
          port: 9001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-buckets
  namespace: storage
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: amazon/aws-cli:2.31.9
          envFrom:
            - secretRef:
                name: rustfs-credentials
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: S3_ENDPOINT
              value: http://rustfs.storage.svc.cluster.local:9000
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until aws --endpoint-url "$S3_ENDPOINT" s3 ls >/dev/null 2>&1; do
                echo "waiting for rustfs"
                sleep 3
              done
              for bucket in raw processed; do
                aws --endpoint-url "$S3_ENDPOINT" s3api create-bucket \
                  --bucket "$bucket" 2>/dev/null || echo "$bucket exists"
              done
              aws --endpoint-url "$S3_ENDPOINT" s3 ls