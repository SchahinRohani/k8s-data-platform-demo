apiVersion: coroot.com/v1
kind: Coroot
metadata:
  name: coroot
  namespace: observability
spec:
  communityEdition: {}
  authAnonymousRole: Admin
  metricsRefreshInterval: 15s
  metricsTTL: 3d
  logsTTL: 3d
  tracesTTL: 3d
  storeMetricsInClickhouse: true
  nodeAgent:
    ebpfTracer:
      enabled: false
    ebpfProfiler:
      enabled: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coroot
  namespace: observability
spec:
  hostnames:
    - coroot.localhost
  parentRefs:
    - name: local
      namespace: gateway
      sectionName: http
  rules:
    - backendRefs:
        - name: coroot-coroot
          port: 8080
